# Stellaris Supporter local configuration example.
schema_version = 1
language = "ko"

# Relative paths are resolved from this file's directory.
# game_root = "C:/Games/Steam/steamapps/common/Stellaris"
# data_dir = "C:/Users/you/AppData/Local/StellarisSupporter/data"

[network]
enabled = false

[limits]
file_bytes = 16777216
total_bytes = 536870912
max_depth = 128
max_files = 50000
query_chars = 512
max_results = 100
