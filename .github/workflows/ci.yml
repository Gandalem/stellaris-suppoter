name: Package and tooling

on:
  push:
    branches:
      - main
      - 'task/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-setup:
    name: Clean setup - ${{ matrix.os }} - Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.13'
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # verified v5 ref
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # verified v6 ref
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and development tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Check installed dependencies
        run: python -m pip check
      - name: Import package
        run: python -c "import stellaris_supporter; print(stellaris_supporter.__version__)"
      - name: Check CLI help
        run: stellaris-supporter --help
      - name: Check CLI version
        run: stellaris-supporter --version
      - name: Report Python and SQLite runtime
        run: python -c "import sqlite3, sys; print('Python', sys.version.split()[0], 'SQLite', sqlite3.sqlite_version)"
      - name: Run tests
        run: python -m pytest
      - name: Run Ruff
        run: python -m ruff check .
      - name: Validate harness ledgers and links
        run: python scripts/check_harness.py
      - name: Measure synthetic retrieval SQL baseline (non-gating)
        run: python scripts/bench_retrieval.py
        continue-on-error: true
      - name: Measure synthetic SQLite read preflight (non-gating)
        run: python scripts/bench_storage_schema.py
        continue-on-error: true
      - name: Measure authored synthetic domain candidate reparse cost (non-gating)
        run: python scripts/bench_domain_wave2.py
        continue-on-error: true
      - name: Measure synthetic Phase B verification parse cost (non-gating)
        run: python scripts/bench_domain_wave3.py
        continue-on-error: true
      - name: Measure synthetic event candidate parse cost (non-gating)
        run: python scripts/bench_domain_event.py
        continue-on-error: true
      - name: Measure scripted domain candidate parse cost (non-gating)
        run: python scripts/bench_domain_scripted.py
        continue-on-error: true

  desktop-package:
    name: Windows desktop folder smoke
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -e ".[dev,desktop,package]"
      - run: python -m pytest tests/test_desktop.py
      - run: python scripts/build_desktop.py
      - shell: pwsh
        run: |
          $prefs = Join-Path $env:RUNNER_TEMP 'desktop-smoke.json'
          $proc = Start-Process -FilePath './dist/StellarisSupporter/StellarisSupporter.exe' -ArgumentList @('--smoke','--preferences',$prefs) -PassThru -Wait -WindowStyle Hidden
          if ($proc.ExitCode -ne 0) { throw 'Desktop smoke failed' }
