name: Package and tooling

on:
  push:
    branches:
      - main
      - 'task/**'
      - 'remediation/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-setup:
    name: Clean setup - ${{ matrix.os }} - Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.13'
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # verified v5 ref
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # verified v6 ref
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and development tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Check installed dependencies
        run: python -m pip check
      - name: Import package
        run: python -c "import stellaris_supporter; print(stellaris_supporter.__version__)"
      - name: Check CLI help
        run: stellaris-supporter --help
      - name: Check CLI version
        run: stellaris-supporter --version
      - name: Run tests
        run: python -m pytest
      - name: Run Ruff
        run: python -m ruff check .
      - name: Validate harness ledgers and links
        run: python scripts/check_harness.py
